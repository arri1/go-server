# docker compose up --build поднимает API и Postgres вместе.
# Сервисы в одной compose-сети видят друг друга по имени: хост БД = `db`.

services:
  db:
    image: postgres:16-alpine
    container_name: go-server-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_server
    ports:
      # Проброс на хост, чтобы можно было ходить в БД с машины (DBeaver, psql).
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # SQL из migrations/ выполнится только при первой инициализации тома.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d go_server"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: go-server-api
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/go_server?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        # Ждём, пока Postgres станет готов принимать соединения.
        condition: service_healthy

volumes:
  pgdata:
